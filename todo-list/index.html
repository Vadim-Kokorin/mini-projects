<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Умный ToDo-лист</h1>
    <form class="input-form" id="form">
      <input placeholder="текст задачи" type="text" id="textTask" />
      <button type="submit" class="btn-add" id="btnAdd">Добавить</button>
    </form>

    <div class="container">
      <button>Все</button>
      <button>Активные</button>
      <button>Выполненные</button>
    </div>

    <div id="tasks-list"></div>

    <div class="container-result">
      <p id="counterTasks">Всего задач:</p>
      <p>Выполнено:</p>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
